<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacotes | Marau Dance Festival</title>

    <link rel="shortcut icon" href="imagens/teste/mdf.ico">
    <link rel="stylesheet" href="css/pacotes.css">
</head>

<body>

<header>
    <div class="logo">
        <img src="imagens/maraú02.png" alt="Marau Dance Festival">
    </div>

    <!-- IDIOMAS (PADRÃO lang-btn) -->
   <div class="lang-switch">
    <button class="lang-btn active" data-lang="pt">
        <img src="imagens/teste/bandeira BRASIL.png" alt="Português">
    </button>

    <button class="lang-btn" data-lang="en">
        <img src="imagens/teste/bandeira USA.png" alt="English">
    </button>

    <button class="lang-btn" data-lang="es">
        <img src="imagens/teste/bandeira espanha.png" alt="Español">
    </button>
</div>

    <!-- BOTÃO HAMBÚRGUER -->
    <button class="menu-toggle" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- MENU -->
   <nav class="menu">
    <a href="index.html" data-i18n="menu_home">Página Inicial</a>
    <a href="artistas.html" data-i18n="menu_artistas">Artistas</a>
    <a href="hospedagem.html" data-i18n="menu_hospedagem">Hospedagem</a>
    <a href="galeria.html" data-i18n="menu_galeria">Galeria</a>
    <a href="programacao.html" data-i18n="menu_programacao">Programação</a>
    <a href="comoChegar.html" data-i18n="menu_como_chegar">Como Chegar</a>
</nav>
</header>

<main>

    <h1 data-i18n="titulo_pacotes">
    Pacotes Marau Dance Festival 2026
    </h1>

    <section class="pacotes-grid">

        <div class="lote img-wrap">
            <img src="imagens/flyer/Lote03.jpg" alt="Pacote Lote 3">
            <img class="overlay-lotado" src="imagens/esgotado.jpeg" alt="Lotado">
        </div>

        <div class="lote img-wrap">
            <img src="imagens/flyer/Bailes03.jpg" alt="Pacote Bailes">
            <img class="overlay-lotado1" src="imagens/esgotado.jpeg" alt="Lotado">
        </div>

    </section>

    <h2 data-i18n="validade">
    Disponível até 28 de Janeiro de 2026
    </h2>

    <div class="comprar">
        <a href="https://www.danceplace.com/ticket/buy/14734" target="_blank">
            <img src="imagens/teste/botao-comprar.jpg" alt="Comprar ingresso">
        </a>
    </div>

    <div class="Patrocinio">
        <img src="imagens/professores/Patrocinador.png" alt="Patrocinadores">
    </div>

</main>

<footer>
    <span data-i18n="footer.text">
        © Marau Dance Festival - Todos os direitos reservados. By Newton Pohsner.
    </span>
</footer> 

<script src="js/pacotes.js"></script>

</body>
</html>
